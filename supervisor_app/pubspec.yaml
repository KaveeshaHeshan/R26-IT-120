name: supervisor_app
description: IoT-Enabled Rubber Latex Quality Assessment - Supervisor App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.3.2

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # Connectivity (hotspot status)
  connectivity_plus: ^6.0.5

  # Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Google Maps
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.10
  http: ^1.2.2

  # OpenStreetMap route map (SupervisorRouteScreen) — no API key or billing.
  # Pinned to flutter_map 7.x: the screen targets the v7 API
  # (MapOptions.initialCenter/initialZoom, Marker.child).
  flutter_map: ^7.0.0
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rubber_tree.jpg