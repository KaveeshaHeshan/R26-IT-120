name: supervisor_app
description: IoT-Enabled Rubber Latex Quality Assessment - Supervisor App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Connectivity (hotspot status)
  connectivity_plus: ^6.0.5

  # Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Google Maps
  google_maps_flutter: ^2.9.0
  google_maps_flutter_web: ^0.5.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true