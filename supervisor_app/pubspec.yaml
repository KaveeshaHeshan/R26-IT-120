name: supervisor_app
description: IoT-Enabled Rubber Latex Quality Assessment - Supervisor App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # Connectivity (hotspot status)
  connectivity_plus: ^6.0.5

  # Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  http: ^1.2.2

  # OpenStreetMap maps — no API key or billing. Used by both the supervisor
  # route screen and the farmer location picker.
  # Pinned to flutter_map 7.x: the screen targets the v7 API
  # (MapOptions.initialCenter/initialZoom, Marker.child).
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Local persistence (farmer app settings)
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/rubber_tree.jpg
